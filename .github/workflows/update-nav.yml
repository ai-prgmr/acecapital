name: Update AMFI NAV Data Weekdays

on:
  schedule:
    # Runs at 21:00 UTC (2:30 AM IST) every night (Tue-Sat mornings / Mon-Fri nights basically)
    - cron: '0 21 * * 2-6'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Grants GitHub Actions bot permission to commit changes
  actions: write # Grants permission to trigger other workflows via gh cli

jobs:
  update-nav-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and Process 14 AMC Mutual Funds
        run: node scripts/update-funds.js

      - name: Commit and Push Updated Funds JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/funds.json
          git diff-index --quiet HEAD || (git commit -m "chore: nightly NAV & performance sync [skip ci]" && git push)
          
      - name: Trigger Next.js Build Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run nextjs.yml --ref master