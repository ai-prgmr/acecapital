name: Update AMFI NAV Data Weekdays

on:
  schedule:
    # Runs at 18:00 UTC (11:30 PM IST) every night (Tue-Sat mornings / Mon-Fri nights basically, adjusting for the request 2-6)
    - cron: '0 18 * * 2-6'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Grants GitHub Actions bot permission to commit changes

jobs:
  update-nav-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and Process 14 AMC Mutual Funds
        run: node scripts/update-funds.js

      - name: Commit and Push Updated Funds JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/funds.json
          git diff-index --quiet HEAD || (git commit -m "chore: nightly NAV & performance sync [skip ci]" && git push)